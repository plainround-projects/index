<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Template: one run as numbered steps across swimlanes</title>
<desc id="d">Four numbered steps run top to bottom. Each row names the step on the left and draws its message between two lanes. Step 3 has a failure branch in the warning tone, and the last row ends in a success result.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="639" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="638" rx="16"/>
<text class="title" x="48" y="68">One run, step by step</text>
<text class="caption" x="48" y="100">One mono line: which run this is, and which failure the warning row drills.</text>

<rect class="actor" x="424" y="128" width="136" height="48" rx="24"/>
<text class="lane" x="492" y="158" text-anchor="middle">Client</text>
<rect class="svc" x="620" y="128" width="160" height="48" rx="10"/>
<text class="lane" x="700" y="158" text-anchor="middle">Service</text>
<rect class="svc" x="820" y="128" width="136" height="48" rx="10"/>
<text class="lane" x="888" y="158" text-anchor="middle">Topic</text>
<rect class="svc" x="1000" y="128" width="152" height="48" rx="10"/>
<text class="lane" x="1076" y="158" text-anchor="middle">Worker</text>
<path class="hair" d="M492 176V544M700 176V544M888 176V544M1076 176V544"/>
<path class="hair" d="M66 216V536"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">The client calls</text>
<text class="sub" x="96" y="232">the detail, at most 33 characters</text>
<path class="sync" d="M492 216H700"/>
<text class="label t-accent" x="512" y="206">POST /thing</text>

<circle class="dot" cx="66" cy="284" r="15"/><text class="num" x="66" y="289" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="280">The service works alone</text>
<text class="sub" x="96" y="300">a step on one lane: a slot and text</text>
<rect class="slot" x="694" y="266" width="12" height="36" rx="4"/>
<text class="label t-accent" x="716" y="289">validate()</text>

<circle class="dot" cx="66" cy="352" r="15"/><text class="num" x="66" y="357" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="348">The service publishes</text>
<text class="sub" x="96" y="368">the message goes on the edge</text>
<path class="async" d="M700 352H888"/>
<text class="label t-accent" x="716" y="342">send(key)</text>

<circle class="dot-w" cx="66" cy="420" r="15"/><text class="num" x="66" y="425" text-anchor="middle">3x</text>
<text class="label b t-warn" x="96" y="416">The failure the lesson drills</text>
<text class="sub" x="96" y="436">the branch that leaves step 3</text>
<path class="fail" d="M700 420H888"/>
<text class="label t-warn" x="716" y="410">send(no key)</text>

<circle class="dot-g" cx="66" cy="488" r="15"/><text class="num" x="66" y="493" text-anchor="middle">4</text>
<text class="label b t-ink" x="96" y="484">The worker reads</text>
<text class="sub" x="96" y="504">the last row ends in the result</text>
<path class="async" d="M888 488H1076"/>
<text class="label t-accent" x="904" y="478">poll()</text>
<rect class="win" x="424" y="470" width="344" height="40" rx="10"/>
<text class="label b t-good" x="440" y="495">the line the run prints at the end</text>

<path class="sync" d="M48 596H112"/><text class="legend" x="124" y="601">sync call</text>
<path class="async" d="M264 596H328"/><text class="legend" x="340" y="601">async message</text>
<path class="read" d="M520 596H584"/><text class="legend" x="596" y="601">read</text>
<path class="fail" d="M696 596H760"/><text class="legend" x="772" y="601">failure path</text>
<path class="ok" d="M928 596H992"/><text class="legend" x="1004" y="601">result</text>
</svg>
